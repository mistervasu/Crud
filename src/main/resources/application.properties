spring.application.name=crud
spring.datasource.url=jdbc:mysql://localhost:3306/crud_db
spring.datasource.username=root
spring.datasource.password=redhat@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

#actuators
management.endpoints.web.exposure.include=*
#to view the responce of info endpoint
management.info.env.enabled=true

#viewed by navigating to http://localhost:8080/actuator/info endpoint
info.app.name= Spring boot Restful web services
info.app.description= Spring boot Restful web services with mysql database
info.app.version= 1.0.0

#health endpoint by default shows only status of the application, to vie all other details below properties are added
management.endpoint.health.show-details=always

#/shutdown endpoint
management.endpoint.shutdown.enabled=true